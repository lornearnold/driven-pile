[project]
name = "driven-pile"
dynamic = ["version"]
description = "Long-term capacity of driven piles from the pile-driving log: a pore-pressure-tracking inversion of blow counts."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Lorne Arnold"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/lornearnold/driven-pile"
Documentation = "https://lornearnold.github.io/driven-pile/"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/driven_pile"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
docs = ["great-docs", "ipykernel", "matplotlib>=3.8"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
great-docs = { git = "https://github.com/posit-dev/great-docs.git" }

[tool.ruff]
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: sweeps every pile's top-segment band (several minutes)"]
