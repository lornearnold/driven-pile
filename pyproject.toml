[project]
name = "driven-pile"
version = "0.0.1"
description = "Long-term capacity of driven piles from the pile-driving log: a pore-pressure-tracking inversion of blow counts (Arnold, ASCE 2027)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lorne Arnold", email = "arnoldl@uw.edu" }]
requires-python = ">=3.11"
dependencies = [
    "great-docs>=0.17.0",
    "numpy>=1.26",
    "scipy>=1.11",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/lornearnold/driven-pile"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driven_pile"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: sweeps every pile's top-segment band (several minutes)"]
